[project]
name = "ee-instruments"
version = "0.1.0"
description = "Python drivers for lab test equipment over GPIB/VISA/serial"
readme = "README.md"
license = "MIT"
# Floor is 3.11 for enum.StrEnum (keysight_mso).
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "matplotlib",
    "pandas",
    "pyarrow",
    "pyserial",
    "pyvisa",
    "pyvisa-py",
    "python-vxi11",
    "requests",
    # python-vxi11 does `import xdrlib` (vxi11/rpc.py), but PEP 594 removed
    # xdrlib from the stdlib in 3.13, so importing hp_436a or hp_8662a there
    # raises ModuleNotFoundError. standard-xdrlib is the PEP 594 "dead battery"
    # redistribution of the stdlib module and satisfies that import unchanged.
    # Remove this once python-vxi11 is gone -- see the pyvisa port issue.
    "standard-xdrlib; python_version >= '3.13'",
]

[dependency-groups]
dev = ["pre-commit", "ruff"]
