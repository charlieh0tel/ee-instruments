# Hooks are `local` + `system` on purpose: they shell out to `uv run ruff`, so
# the ruff version is whatever uv.lock pins. A `ruff-pre-commit` repo/rev would
# be a second version to keep in sync with the dev dependency group.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
