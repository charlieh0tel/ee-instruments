version: 2

updates:
# The actions here are referenced by major-version tag, so what Dependabot
# brings is the next major when one ships, grouped into one weekly PR.
#
# Actions only: advisories for the locked dependencies come from Dependabot
# alerts and security updates, and version bumps alone are noise.
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    actions:
      patterns: ["*"]
