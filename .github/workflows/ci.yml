name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # Without a matrix, CI silently tests whatever interpreter it happens to
        # find, which is how the python-vxi11/xdrlib breakage on 3.13 went
        # unnoticed. 3.11 is the declared floor; 3.13 is where xdrlib was
        # removed, so it is the case the standard-xdrlib marker exists to cover.
        python-version: ["3.11", "3.12", "3.13"]
    # @v1, not @main: at the tag the workflow's own composite actions are
    # pinned to @v1 too, so this pins the whole tree rather than just the entry
    # point.
    uses: charlieh0tel/deb-workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: ${{ matrix.python-version }}
      # No unit tests -- the drivers need real instruments -- so the "test"
      # slot runs the import smoke check instead. It must start with the tool
      # name, so MPLBACKEND and sys.path are set inside the script.
      test-command: "python tools/smoke_import.py"
    # Defaults cover the rest: the workflow detects uv from uv.lock, then
    # lock-check=auto makes the sync `--locked`, and lint/format run ruff from
    # the locked project environment (ruff.toml pins the rule set).
