name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked

    - name: Lint
      run: uv run ruff check .

    - name: Check formatting
      run: uv run ruff format --check .

    - name: Import drivers
      run: uv run python -c "import cal_rf_sensor, hp_436a, hp_8662a, keithley_2015, keysight_mso, mso_grab_png, rs_smb100a"
